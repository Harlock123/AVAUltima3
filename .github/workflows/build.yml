# Every push: build, then publish AVAUltima3 as a self-contained single-file program for every
# platform the game's OpenAL audio package ships natives for. The builds are attached to the
# workflow run; pushes to main also refresh the "latest" pre-release, and a v* tag (e.g. v0.1.0)
# makes a proper release.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Build
        run: dotnet build UltimaIII.sln -c Release

  publish:
    needs: build
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    strategy:
      fail-fast: false
      matrix:
        # No linux-musl-*: Silk.NET.OpenAL.Soft.Native has no musl build.
        rid:
          - win-x64
          - win-x86
          - win-arm64
          - linux-x64
          - linux-arm64
          - linux-arm
          - osx-x64
          - osx-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - name: Publish ${{ matrix.rid }}
        # IncludeAllContentForSelfExtract bundles Assets/Music; AudioService finds it through
        # AppContext.BaseDirectory, which points at the extraction folder.
        run: >
          dotnet publish src/UltimaIII.Avalonia/UltimaIII.Avalonia.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish/${{ matrix.rid }}
      - name: Package
        # The executable is renamed AVAUltima3. Windows gets a zip; everything else a tar.gz,
        # which keeps the executable bit.
        run: |
          mkdir -p artifacts
          name="AVAUltima3-${{ matrix.rid }}"
          cd publish/${{ matrix.rid }}
          cp ../../LICENSE ../../README.md .
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            mv UltimaIII.Avalonia.exe AVAUltima3.exe
            zip -9 -r "../../artifacts/$name.zip" .
          else
            mv UltimaIII.Avalonia AVAUltima3
            chmod +x AVAUltima3
            tar -czf "../../artifacts/$name.tar.gz" .
          fi
      - uses: actions/upload-artifact@v7
        with:
          # Uploaded as-is (no zip around the zip/tar.gz): the artifact is named after the file.
          path: artifacts/AVAUltima3-${{ matrix.rid }}.*
          archive: false
          if-no-files-found: error

  release:
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
          # The builds were uploaded as their own .zip/.tar.gz files: keep them that way.
          skip-decompress: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "AVAUltima3 $GITHUB_REF_NAME" --generate-notes
          else
            # A rolling pre-release of the newest main build.
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest artifacts/* --prerelease --target "$GITHUB_SHA" \
              --title "Latest build (main)" \
              --notes "Built automatically from ${GITHUB_SHA::7} on main. Unzip or untar and run AVAUltima3 (AVAUltima3.exe on Windows)."
          fi
